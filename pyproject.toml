[tool.poetry]
name = "logsentinel"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
package-mode = true
packages = [
    {include = "logsentinel", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
typer = { extras = ["all"], version = "*" }
rich = "*"
boto3 = "^1.43.2"

[tool.pytest.ini_options]
testpaths =["tests"]
pythonpath =["src"]
addopts = "--cov=src/logsentinel --cov-report=term-missing"
markers = ["localstack: tests that require LocalStack — start with: docker run --rm -d -p 4566:4566 localstack/localstack"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "^0.15.4"
mypy = "^1.19.1"
moto = {version = ">=5.1.21,<6.0.0", extras = ["dynamodb", "kinesis", "s3", "sqs", "ssm"]}
requests = "^2.33.1"
boto3-stubs = {extras = ["cloudformation", "dynamodb", "kinesis", "s3", "sqs", "ssm", "sts", "iam", "lambda"], version = "^1.43.6"}
logsentinel-sdk = {path = "../logsentinel-sdk"}

[tool.poetry.scripts]
logsentinel = "logsentinel.cli:app"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"